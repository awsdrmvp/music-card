<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毛玻璃音乐卡片</title>
<style id="app-css">
  :root{
    --bg-blur: 0px;
    --card-blur: 32px;
    --spectrum-height: 34px;
    --squircle-ratio: 0.36;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 100px 20px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #fff;
    background: #0b0e14;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  [data-i18n]{
    transition: opacity .18s ease, transform .22s cubic-bezier(.4,0,.2,1);
  }
  body.lang-switching [data-i18n]{
    opacity: 0;
    transform: translateY(-6px);
  }
  .bg{
    position: fixed; inset: -100px; z-index: -2;
    background: linear-gradient(140deg, #1e2d3d 0%, #3a4a5e 45%, #111822 100%);
    background-size: cover; background-position: center; background-repeat: no-repeat;
    transform: scale(1.04);
    filter: blur(var(--bg-blur, 0px));
    transition: filter .25s ease;
  }
  .bg::after{
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,.1), rgba(0,0,0,.7) 100%);
  }
  .top-right{
    position: fixed; top: 16px; right: 16px; z-index: 20;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .uploader{
    display: flex; flex-direction: column; gap: 6px; padding: 10px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-radius: 24px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 0 rgba(255,255,255,.30);
  }
  .up{
    display: flex; align-items: center; gap: 9px;
    padding: 8px 13px 8px 11px;
    font-size: 13px; font-family: inherit; letter-spacing: .3px;
    color: rgba(255,255,255,.88);
    background: rgba(255,255,255,.06);
    cursor: pointer; user-select: none;
    transition: background .22s ease, transform .15s ease;
    white-space: nowrap; border: none; border-radius: 999px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .up:hover{ background: rgba(255,255,255,.20); }
  .up:active{ transform: scale(.97); }
  .up input{ display: none; }
  .up svg{ width: 15px; height: 15px; opacity: .9; flex: none; }
  .up.done{ background: rgba(120,220,170,.22); color: #d8ffee; }
  .up.done::after{
    content: "✓"; font-size: 12px; margin-left: 2px;
    animation: checkIn .35s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes checkIn{ 0%{opacity:0;transform:scale(.4);} 100%{opacity:1;transform:scale(1);} }
  .settings-wrap{ position: relative; }
  .settings-btn{
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    color: rgba(255,255,255,.88);
    display: grid; place-items: center; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 0 rgba(255,255,255,.30);
    transition: background .25s ease, transform .35s cubic-bezier(.2,.9,.3,1.3);
  }
  .settings-btn:hover{ background: rgba(255,255,255,.20); }
  .settings-btn:active{ transform: scale(.94); }
  .settings-btn svg{ width: 17px; height: 17px; display: block; transition: transform .4s cubic-bezier(.2,.9,.3,1.3); }
  .settings-btn.open{ background: rgba(255,255,255,.24); }
  .settings-btn.open svg{ transform: rotate(90deg); }
  .settings-panel{
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 250px; padding: 16px 16px 14px;
    background: rgba(255, 255, 255, 0.11);
    backdrop-filter: blur(36px) saturate(190%);
    -webkit-backdrop-filter: blur(36px) saturate(190%);
    border-radius: 18px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.22),
      inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 -4px 12px rgba(0,0,0,.08),
      inset 0 0 60px rgba(255,255,255,.04),
      0 20px 48px rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transform: translateY(-8px) scale(.96);
    transform-origin: top right;
    transition: opacity .25s ease, transform .28s cubic-bezier(.2,.9,.3,1.25);
  }
  .settings-panel.open{ opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
  .settings-title{
    font-size: 12.5px; letter-spacing: 1.2px;
    color: rgba(255,255,255,.7); text-transform: uppercase;
    margin-bottom: 12px;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .setting-row + .setting-row{ margin-top: 14px; }
  .setting-head{
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12.5px; color: rgba(255,255,255,.92); margin-bottom: 8px;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .setting-val{
    font-size: 11.5px; color: rgba(255,255,255,.7);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .settings-panel input[type="range"]{
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 99px;
    background: rgba(255,255,255,.28);
    outline: none; cursor: pointer; display: block;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.18);
  }
  .settings-panel input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%; background: #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.22);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .settings-panel input[type="range"]::-webkit-slider-thumb:hover{
    transform: scale(1.15);
    box-shadow: 0 2px 12px rgba(0,0,0,.55), 0 0 0 4px rgba(255,255,255,.32);
  }
  .settings-panel input[type="range"]::-moz-range-thumb{
    width: 14px; height: 14px; border-radius: 50%; background: #ffffff; border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.22);
    cursor: pointer;
  }
  .seg-toggle{
    position: relative; display: flex;
    background: rgba(255,255,255,.10);
    border-radius: 10px; padding: 3px; gap: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .seg-slider{
    position: absolute; top: 3px; left: 0;
    height: calc(100% - 6px); width: 0; border-radius: 7px;
    background: rgba(255,255,255,.28);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), 0 2px 8px rgba(0,0,0,.18);
    pointer-events: none; z-index: 0;
    transition: transform .34s cubic-bezier(.4, 0, .2, 1), width .34s cubic-bezier(.4, 0, .2, 1), opacity .2s ease;
  }
  .seg-opt{
    position: relative; z-index: 1; flex: 1; padding: 7px 0;
    border: none; background: transparent;
    color: rgba(255,255,255,.75);
    font-size: 12px; font-family: inherit; border-radius: 7px;
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.2);
    transition: color .25s ease, transform .18s ease;
  }
  .seg-opt:hover{ color: #fff; }
  .seg-opt:active{ transform: scale(.96); }
  .seg-opt.active{ color: #fff; }
  .video-modal{
    position: fixed; z-index: 100; display: none;
    background: rgba(255, 255, 255, 0.13);
    backdrop-filter: blur(38px) saturate(200%);
    -webkit-backdrop-filter: blur(38px) saturate(200%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.24),
      inset 0 1px 0 rgba(255,255,255,.46),
      inset 0 -4px 12px rgba(0,0,0,.08),
      inset 0 0 80px rgba(255,255,255,.05),
      0 24px 64px rgba(0,0,0,.5);
    overflow: hidden; isolation: isolate;
  }
  .video-modal-inner{
    position: relative; width: 100%; height: 100%;
    padding: 18px 18px 16px;
    display: flex; flex-direction: column;
    opacity: 0;
    transition: opacity .3s ease .15s;
  }
  .video-modal-inner.visible{ opacity: 1; }
  .video-modal-header{
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex: none;
  }
  .video-modal-title{
    font-size: 14px; letter-spacing: .5px;
    color: rgba(255,255,255,.96); font-weight: 500;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .video-modal-close{
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.85);
    display: grid; place-items: center; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    transition: background .2s ease, transform .18s ease;
  }
  .video-modal-close:hover{ background: rgba(255,255,255,.26); }
  .video-modal-close:active{ transform: scale(.9); }
  .video-modal-close svg{ width: 13px; height: 13px; display: block; }
  .video-modal-section + .video-modal-section{ margin-top: 14px; }
  .video-modal-label{
    font-size: 11.5px; letter-spacing: .8px;
    color: rgba(255,255,255,.65); margin-bottom: 7px;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .video-modal .seg-opt{ font-size: 11px; padding: 8px 0; }
  .video-export-btn{
    margin-top: auto; width: 100%;
    padding: 12px 16px; border: none; border-radius: 14px;
    background: rgba(255,255,255,.20); color: #fff;
    font-size: 13px; font-family: inherit; font-weight: 500; letter-spacing: .4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.32),
      inset 0 1px 0 rgba(255,255,255,.5),
      0 8px 20px rgba(0,0,0,.2);
    transition: background .22s ease, transform .18s ease;
  }
  .video-export-btn:hover{ background: rgba(255,255,255,.30); }
  .video-export-btn:active{ transform: scale(.97); }
  .video-export-btn:disabled{ opacity: .6; cursor: not-allowed; transform: none; }
  .video-export-btn svg{ width: 15px; height: 15px; flex: none; }
  .stage{
    width: min(360px, 88vw);
    display: flex; flex-direction: column; align-items: center;
  }
  .card{
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 24px 48px 44px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(var(--card-blur, 32px)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--card-blur, 32px)) saturate(180%);
    transition: backdrop-filter .25s ease, -webkit-backdrop-filter .25s ease;
    overflow: hidden; isolation: isolate;
  }
  .card::before{
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(145deg,
                rgba(255,255,255,.30) 0%,
                rgba(255,255,255,.02) 40%,
                rgba(255,255,255,.01) 60%,
                rgba(255,255,255,.14) 100%);
    pointer-events: none; z-index: 1;
  }
  .card::after{
    content: ""; position: absolute;
    width: 60%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 70%);
    filter: blur(30px); top: -20%; left: 50%;
    transform: translateX(-50%); opacity: .6;
    pointer-events: none; z-index: 0;
  }
  .card-edge-svg{
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 4; overflow: visible;
  }
  .album-wrap{
    position: relative; z-index: 2; width: 60%; aspect-ratio: 1 / 1;
    display: grid; place-items: center;
    border-radius: 22px;
    background: rgba(255,255,255,.1);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), inset 0 8px 20px rgba(0,0,0,.2), 0 12px 28px rgba(0,0,0,.3);
    padding: 10px; margin-top: 14px;
  }
  .album-art{
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,.4);
    display: none;
  }
  .album-placeholder{
    width: 100%; height: 100%;
    display: grid; place-items: center;
    border-radius: 14px;
    background: rgba(255,255,255,.06);
    color: rgba(255,255,255,.5);
  }
  .album-placeholder svg{ width: 36px; height: 36px; }
  .progress-area{
    position: relative; z-index: 2; width: 100%;
    display: flex; flex-direction: column; gap: 8px; margin-top: 18px;
  }
  .spectrum-slot-card{
    width: 100%; height: var(--spectrum-height, 34px);
    overflow: hidden;
    transition: height .35s cubic-bezier(.4, 0, .2, 1), opacity .28s ease, margin .35s cubic-bezier(.4, 0, .2, 1);
  }
  body.spectrum-at-bottom .spectrum-slot-card{
    height: 0; opacity: 0; margin: 0; pointer-events: none;
  }
  .spectrum-slot-bottom{
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 0; opacity: 0; overflow: hidden;
    pointer-events: none; z-index: 5;
    transition: height .35s cubic-bezier(.4, 0, .2, 1), opacity .28s ease;
  }
  body.spectrum-at-bottom .spectrum-slot-bottom{
    height: var(--spectrum-height, 34px); opacity: 1;
  }
  .spectrum-canvas{ display: block; width: 100%; height: var(--spectrum-height, 34px); }
  .progress{
    position: relative; width: 100%; height: 22px;
    display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  .track{
    position: relative; width: 100%; height: 5px; border-radius: 99px;
    background: rgba(255,255,255,.25); overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.2);
    transition: background .22s ease;
  }
  .progress:hover .track{ background: rgba(255,255,255,.32); }
  .fill{
    height: 100%; width: 0%; border-radius: 99px;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(255,255,255,.8);
    transition: width .06s linear;
  }
  .knob{
    position: absolute; top: 50%; left: 0%;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px rgba(0,0,0,.5), 0 0 0 3px rgba(255,255,255,.15);
    pointer-events: none;
    transition: left .06s linear, transform .25s cubic-bezier(.2,.9,.3,1.3);
  }
  .progress:hover .knob{ transform: translate(-50%,-50%) scale(1.15); }
  .progress:active .knob{ transform: translate(-50%,-50%) scale(1.3); }
  .times{
    display: flex; justify-content: space-between;
    padding: 0 4px; font-size: 12px; letter-spacing: .5px;
    color: rgba(255,255,255,.85);
    font-variant-numeric: tabular-nums;
  }
  .controls{
    position: relative; z-index: 2; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
  }
  .btn-pill{
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 8px 16px; border-radius: 999px; border: none;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #fff; font-size: 13px; font-family: inherit; font-weight: 500;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.5), 0 6px 16px rgba(0,0,0,.2);
    transition: transform .22s cubic-bezier(.2,.9,.3,1.3), background .22s ease;
  }
  .btn-pill:hover{ background: rgba(255,255,255,.28); }
  .btn-pill:active{ transform: scale(.92); }
  .btn-pill svg{ width: 15px; height: 15px; flex: none; }
  .btn-play{
    position: relative; width: 58px; height: 58px;
    border-radius: 50%; border: none;
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #fff;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.4), inset 0 2px 0 rgba(255,255,255,.6), 0 10px 28px rgba(0,0,0,.3);
    transition: transform .22s cubic-bezier(.2,.9,.3,1.3), background .22s ease;
  }
  .btn-play:hover{ background: rgba(255,255,255,.30); }
  .btn-play:active{ transform: scale(.9); }
  .btn-play svg{
    position: absolute; top: 50%; left: 50%;
    width: 25px; height: 25px;
    transition: opacity .25s ease, transform .3s cubic-bezier(.2,.9,.3,1.3);
  }
  .btn-play .icon-play{ transform: translate(-50%, -50%) scale(1) translateX(1px); opacity: 1; }
  .btn-play .icon-pause{ transform: translate(-50%, -50%) scale(.5); opacity: 0; }
  .btn-play.playing .icon-play{ transform: translate(-50%, -50%) scale(.5); opacity: 0; }
  .btn-play.playing .icon-pause{ transform: translate(-50%, -50%) scale(1); opacity: 1; }
  @media (max-width: 420px){
    body{ padding: 90px 16px 32px; }
    .top-right{ top: 10px; right: 10px; gap: 6px; }
    .uploader{ padding: 8px; gap: 5px; }
    .up{ font-size: 12px; padding: 7px 11px 7px 9px; }
    .settings-btn{ width: 34px; height: 34px; }
    .settings-btn svg{ width: 15px; height: 15px; }
    .settings-panel{ width: 230px; padding: 14px; }
    .card{ padding: 20px 36px 36px; }
    .album-wrap{ width: 58%; border-radius: 18px; padding: 8px; margin-top: 10px; }
    .album-art, .album-placeholder{ border-radius: 11px; }
    .album-placeholder svg{ width: 30px; height: 30px; }
    .progress-area{ margin-top: 14px; gap: 6px; }
    .btn-play{ width: 52px; height: 52px; }
    .btn-play svg{ width: 22px; height: 22px; }
    .btn-pill{ padding: 7px 13px; font-size: 12px; }
    .btn-pill svg{ width: 13px; height: 13px; }
    .times{ font-size: 11px; }
    .video-modal-inner{ padding: 14px; }
    .video-modal-title{ font-size: 13px; }
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="top-right">
  <div class="uploader" id="uploader">
    <label class="up" id="upBg" data-i18n-title="uploadBg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.6" cy="8.6" r="1.7"/><path d="m21 15-4.6-4.6L5.2 21.2"/>
      </svg>
      <span data-i18n="uploadBg">背景图片</span>
      <input type="file" id="bgInput" accept="image/*">
    </label>
    <label class="up" id="upIcon" data-i18n-title="uploadIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <span data-i18n="uploadIcon">专辑封面</span>
      <input type="file" id="iconInput" accept="image/*">
    </label>
    <label class="up" id="upAudio" data-i18n-title="uploadAudio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v13"/><path d="M8 6v9M16 6v9M4 9.5v4.5M20 9.5v4.5"/>
      </svg>
      <span data-i18n="uploadAudio">音频文件</span>
      <input type="file" id="audioInput" accept="audio/*">
    </label>
    <button class="up" id="saveBtn" type="button" data-i18n-title="saveWeb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span data-i18n="saveWeb">保存网页</span>
    </button>
    <button class="up" id="videoBtn" type="button" data-i18n-title="saveVideo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="14" height="14" rx="2.5"/><path d="m16 10 5-3v10l-5-3"/>
      </svg>
      <span data-i18n="saveVideo">保存视频</span>
    </button>
  </div>

  <div class="settings-wrap">
    <button class="settings-btn" id="settingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>

/* ============ 超椭圆 ============ */
function squirclePathData(w, h, r, N){
  N = N || 4;
  r = Math.min(r, w / 2, h / 2);
  const e = 2 / N;
  const steps = 32;
  const pts = [];
  for (let i = 0; i <= steps; i++){
    const th = (i / steps) * Math.PI / 2;
    pts.push([(w - r) + r * Math.pow(Math.sin(th), e), r - r * Math.pow(Math.cos(th), e)]);
  }
  pts.push([w, h - r]);
  for (let i = 0; i <= steps; i++){
    const th = (i / steps) * Math.PI / 2;
    pts.push([(w - r) + r * Math.pow(Math.cos(th), e), (h - r) + r * Math.pow(Math.sin(th), e)]);
  }
  pts.push([r, h]);
  for (let i = 0; i <= steps; i++){
    const th = (i / steps) * Math.PI / 2;
    pts.push([r - r * Math.pow(Math.sin(th), e), (h - r) + r * Math.pow(Math.cos(th), e)]);
  }
  pts.push([0, r]);
  for (let i = 0; i <= steps; i++){
    const th = (i / steps) * Math.PI / 2;
    pts.push([r - r * Math.pow(Math.cos(th), e), r - r * Math.pow(Math.sin(th), e)]);
  }
  let d = 'M ' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
  for (let i = 1; i < pts.length; i++){
    d += ' L ' + pts[i][0].toFixed(2) + ' ' + pts[i][1].toFixed(2);
  }
  d += ' Z';
  return d;
}
function getSquircleRatio(){
  const v = parseFloat(document.documentElement.style.getPropertyValue('--squircle-ratio'));
  return (isNaN(v) || v <= 0) ? 0.36 : v;
}
function getSquircleN(ratio){
  const t2 = Math.max(0, Math.min(1, (ratio - 0.10) / 0.40));
  return 6 - t2 * 3.5;
}
const cardEl = document.getElementById('card');
const cardEdgeSvg = document.getElementById('cardEdgeSvg');
const edgePathOuter = document.getElementById('edgePathOuter');
const edgePathInner = document.getElementById('edgePathInner');
function applyAllSquircles(){
  if (!cardEl) return;
  const rect = cardEl.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  if (!w || !h) return;
  const ratio = getSquircleRatio();
  const N = getSquircleN(ratio);
  const r = Math.min(w, h) * ratio;
  const d = squirclePathData(w, h, r, N);
  const p = 'path("' + d + '")';
  cardEl.style.clipPath = p;
  cardEl.style.webkitClipPath = p;
  if (cardEdgeSvg && edgePathOuter && edgePathInner){
    cardEdgeSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    edgePathOuter.setAttribute('d', d);
    edgePathInner.setAttribute('d', d);
  }
}
if ('ResizeObserver' in window){
  const ro = new ResizeObserver(applyAllSquircles);
  ro.observe(cardEl);
}
window.addEventListener('resize', applyAllSquircles);
requestAnimationFrame(applyAllSquircles);
setTimeout(applyAllSquircles, 250);

/* ============ 分段控件 ============ */
function syncSegmented(container){
  if (!container) return;
  const slider = container.querySelector('.seg-slider');
  const active = container.querySelector('.seg-opt.active') || container.querySelector('.seg-opt');
  if (!slider || !active) return;
  const prev = slider.style.transition;
  slider.style.transition = 'none';
  slider.style.width = active.offsetWidth + 'px';
  slider.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  void slider.offsetWidth;
  slider.style.transition = prev || '';
}
function bindSegmented(container, onChange){
  if (!container) return;
  if (container.__segBound){
    if (typeof onChange === 'function') container.__segOnChange = onChange;
    return;
  }
  container.__segBound = true;
  if (typeof onChange === 'function') container.__segOnChange = onChange;
  container.addEventListener('click', function(e){
    const btn = e.target.closest('.seg-opt');
    if (!btn || btn.classList.contains('active')) return;
    container.querySelectorAll('.seg-opt').forEach(function(b){ b.classList.toggle('active', b === btn); });
    const slider = container.querySelector('.seg-slider');
    if (slider){
      slider.style.width = btn.offsetWidth + 'px';
      slider.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
    }
    if (typeof container.__segOnChange === 'function') container.__segOnChange(btn, container);
  });
}

/* ============================================================
   离线渲染导出视频（WebCodecs + 极简 WebM Muxer）
   ============================================================ */

/* ---- 极简 EBML/WebM 写入器 ---- */
const EBML = {
  idBytes(value){
    if (value <= 0xff) return new Uint8Array([value]);
    if (value <= 0xffff) return new Uint8Array([(value >>> 8) & 0xff, value & 0xff]);
    if (value <= 0xffffff) return new Uint8Array([(value >>> 16) & 0xff, (value >>> 8) & 0xff, value & 0xff]);
    return new Uint8Array([(value >>> 24) & 0xff, (value >>> 16) & 0xff, (value >>> 8) & 0xff, value & 0xff]);
  },
  vint(value){
    let len = 1;
    let v = value;
    while (v >= Math.pow(2, 7 * len)) len++;
    const buf = new Uint8Array(len);
    for (let i = len - 1; i >= 0; i--){ buf[i] = v & 0xff; v = Math.floor(v / 256); }
    buf[0] |= (1 << (8 - len));
    return buf;
  },
  uint(value){
    if (value === 0) return new Uint8Array([0]);
    const bytes = [];
    let v = value;
    while (v > 0){ bytes.unshift(v & 0xff); v = Math.floor(v / 256); }
    return new Uint8Array(bytes);
  },
  float64(value){
    const buf = new ArrayBuffer(8);
    new DataView(buf).setFloat64(0, value, false);
    return new Uint8Array(buf);
  },
  str(s){ return new TextEncoder().encode(s); },
  concat(){
    let total = 0;
    for (let i = 0; i < arguments.length; i++) total += arguments[i].length;
    const out = new Uint8Array(total);
    let off = 0;
    for (let i = 0; i < arguments.length; i++){
      out.set(arguments[i], off);
      off += arguments[i].length;
    }
    return out;
  },
  el(id, data){
    const idBytes = EBML.idBytes(id);
    const sizeBytes = EBML.vint(data.length);
    const out = new Uint8Array(idBytes.length + sizeBytes.length + data.length);
    out.set(idBytes, 0);
    out.set(sizeBytes, idBytes.length);
    out.set(data, idBytes.length + sizeBytes.length);
    return out;
  }
};

class WebMWriter {
  constructor(opts){
    this.width = opts.width;
    this.height = opts.height;
    this.frameRate = opts.frameRate;
    this.sampleRate = opts.sampleRate;
    this.channels = opts.channels;
    this.videoCodec = opts.videoCodec || 'V_VP8';
    this.audioCodec = opts.audioCodec || 'A_OPUS';
    this.videoChunks = [];
    this.audioChunks = [];
    this.duration = 0;
  }
  addVideoChunk(chunk){
    const data = new Uint8Array(chunk.byteLength);
    chunk.copyTo(data);
    this.videoChunks.push({
      timestamp: chunk.timestamp,
      isKeyframe: chunk.type === 'key',
      data
    });
    this.duration = Math.max(this.duration, chunk.timestamp / 1000);
  }
  addAudioChunk(chunk){
    const data = new Uint8Array(chunk.byteLength);
    chunk.copyTo(data);
    this.audioChunks.push({ timestamp: chunk.timestamp, data });
    this.duration = Math.max(this.duration, chunk.timestamp / 1000);
  }
  makeSimpleBlock(trackNumber, relTime, isKeyframe, data){
    const out = new Uint8Array(data.length + 4);
    out[0] = 0x80 | trackNumber;
    out[1] = (relTime >> 8) & 0xff;
    out[2] = relTime & 0xff;
    out[3] = isKeyframe ? 0x80 : 0x00;
    out.set(data, 4);
    return out;
  }
  finalize(){
    const ebmlHeader = EBML.el(0x1A45DFA3, EBML.concat(
      EBML.el(0x4286, EBML.uint(1)),
      EBML.el(0x42F7, EBML.uint(1)),
      EBML.el(0x42F2, EBML.uint(4)),
      EBML.el(0x42F3, EBML.uint(8)),
      EBML.el(0x4282, EBML.str('webm')),
      EBML.el(0x4287, EBML.uint(2)),
      EBML.el(0x4285, EBML.uint(2))
    ));

    const info = EBML.el(0x1549A966, EBML.concat(
      EBML.el(0x2AD7B1, EBML.uint(1000000)),
      EBML.el(0x4D80, EBML.str('GlassCardMuxer')),
      EBML.el(0x5741, EBML.str('GlassCardMuxer')),
      EBML.el(0x4489, EBML.float64(this.duration))
    ));

    const videoTrack = EBML.el(0xAE, EBML.concat(
      EBML.el(0xD7, EBML.uint(1)),
      EBML.el(0x73C5, EBML.uint(1)),
      EBML.el(0x83, EBML.uint(1)),
      EBML.el(0x86, EBML.str(this.videoCodec)),
      EBML.el(0xE0, EBML.concat(
        EBML.el(0xB0, EBML.uint(this.width)),
        EBML.el(0xBA, EBML.uint(this.height))
      ))
    ));

    const audioTrack = EBML.el(0xAE, EBML.concat(
      EBML.el(0xD7, EBML.uint(2)),
      EBML.el(0x73C5, EBML.uint(2)),
      EBML.el(0x83, EBML.uint(2)),
      EBML.el(0x86, EBML.str(this.audioCodec)),
      EBML.el(0xE1, EBML.concat(
        EBML.el(0xB5, EBML.float64(this.sampleRate)),
        EBML.el(0x9F, EBML.uint(this.channels))
      ))
    ));

    const tracks = EBML.el(0x1654AE6B, EBML.concat(videoTrack, audioTrack));

    const allFrames = [];
    this.videoChunks.forEach(c => allFrames.push({ ...c, track: 1 }));
    this.audioChunks.forEach(c => allFrames.push({ ...c, track: 2, isKeyframe: true }));
    allFrames.sort((a, b) => a.timestamp - b.timestamp);

    const clusterTimecode = 0;
    const clusterData = [EBML.el(0xE7, EBML.uint(clusterTimecode))];
    for (const frame of allFrames){
      const relTime = Math.round(frame.timestamp / 1000) - clusterTimecode;
      const block = this.makeSimpleBlock(frame.track, relTime, frame.isKeyframe, frame.data);
      clusterData.push(EBML.el(0xA3, block));
    }
    const cluster = EBML.el(0x1F43B675, EBML.concat.apply(null, clusterData));

    const segmentData = EBML.concat(info, tracks, cluster);
    const segment = EBML.el(0x18538067, segmentData);

    return new Blob([ebmlHeader, segment], { type: 'video/webm' });
  }
}

/* ---- FFT（radix-2 Cooley-Tukey） ---- */
function fftInPlace(re, im){
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){
      let tmp = re[i]; re[i] = re[j]; re[j] = tmp;
      tmp = im[i]; im[i] = im[j]; im[j] = tmp;
    }
  }
  for (let len = 2; len <= n; len <<= 1){
    const ang = -2 * Math.PI / len;
    const wRe = Math.cos(ang), wIm = Math.sin(ang);
    for (let i = 0; i < n; i += len){
      let curRe = 1, curIm = 0;
      const half = len >> 1;
      for (let j = 0; j < half; j++){
        const uRe = re[i + j], uIm = im[i + j];
        const vRe = re[i + j + half] * curRe - im[i + j + half] * curIm;
        const vIm = re[i + j + half] * curIm + im[i + j + half] * curRe;
        re[i + j] = uRe + vRe;
        im[i + j] = uIm + vIm;
        re[i + j + half] = uRe - vRe;
        im[i + j + half] = uIm - vIm;
        const newRe = curRe * wRe - curIm * wIm;
        curIm = curRe * wIm + curIm * wRe;
        curRe = newRe;
      }
    }
  }
}

/* ★★★ 修复：和浏览器 AnalyserNode 一致的处理流程
   - Blackman 窗
   - 除以 fftSize × 窗增益 (0.42)
   - 转 dB
   - 从 -95dB ~ -12dB 线性映射到 0~255
   ★★★ */
function computeSpectrumMagnitudes(audioBuffer, sampleOffset, fftSize){
  const re = new Float32Array(fftSize);
  const im = new Float32Array(fftSize);
  const channelData = audioBuffer.getChannelData(0);
  const len = channelData.length;
  const N = fftSize;

  const a0 = 0.42, a1 = 0.5, a2 = 0.08;
  for (let i = 0; i < N; i++){
    const idx = sampleOffset + i - (N >> 1);
    let sample = 0;
    if (idx >= 0 && idx < len){
      const w = a0
        - a1 * Math.cos(2 * Math.PI * i / (N - 1))
        + a2 * Math.cos(4 * Math.PI * i / (N - 1));
      sample = channelData[idx] * w;
    }
    re[i] = sample;
  }

  fftInPlace(re, im);

  const half = N >> 1;
  const magnitudes = new Uint8Array(half);

  const minDb = -95;
  const maxDb = -12;
  const rangeDb = maxDb - minDb;

  const normFactor = N * a0;

  for (let i = 0; i < half; i++){
    const mag = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
    const norm = mag / normFactor;
    const db = 20 * Math.log10(norm + 1e-10);
    const v01 = Math.max(0, Math.min(1, (db - minDb) / rangeDb));
    magnitudes[i] = Math.round(v01 * 255);
  }
  return magnitudes;
}

/* ---- 在目标 canvas 上绘制一帧卡片 ---- */
function drawCardFrame(ctx, W, H, bgImg, coverImg, state){
  const scale = H / 1080;

  if (bgImg){
    const bgRatio = bgImg.naturalWidth / bgImg.naturalHeight;
    const cRatio = W / H;
    let dw, dh, dx, dy;
    if (bgRatio > cRatio){ dh = H; dw = H * bgRatio; dx = (W - dw) / 2; dy = 0; }
    else { dw = W; dh = W / bgRatio; dx = 0; dy = (H - dh) / 2; }
    ctx.drawImage(bgImg, dx, dy, dw, dh);
    ctx.fillStyle = 'rgba(11,14,20,0.5)';
    ctx.fillRect(0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#1e2d3d');
    g.addColorStop(0.45, '#3a4a5e');
    g.addColorStop(1, '#111822');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  const cardH = H * 0.88;
  const cardW = cardH * 0.75;
  const cardX = (W - cardW) / 2;
  const cardY = (H - cardH) / 2;
  const cardR = cardW * 0.25;

  ctx.save();
  roundRect(ctx, cardX, cardY, cardW, cardH, cardR);
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = Math.max(1, 2 * scale);
  ctx.stroke();
  ctx.restore();

  const coverSize = cardW * 0.55;
  const coverX = cardX + (cardW - coverSize) / 2;
  const coverY = cardY + cardH * 0.14;
  const coverR = coverSize * 0.1;

  ctx.save();
  roundRect(ctx, coverX - 5 * scale, coverY - 5 * scale, coverSize + 10 * scale, coverSize + 10 * scale, coverR + 5 * scale);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = Math.max(1, 1.5 * scale);
  ctx.stroke();
  ctx.restore();

  if (coverImg){
    ctx.save();
    roundRect(ctx, coverX, coverY, coverSize, coverSize, coverR);
    ctx.clip();
    const ciRatio = coverImg.naturalWidth / coverImg.naturalHeight;
    let cw, ch, cx, cy;
    if (ciRatio > 1){ ch = coverSize; cw = coverSize * ciRatio; cx = coverX - (cw - coverSize) / 2; cy = coverY; }
    else { cw = coverSize; ch = coverSize / ciRatio; cx = coverX; cy = coverY - (ch - coverSize) / 2; }
    ctx.drawImage(coverImg, cx, cy, cw, ch);
    ctx.restore();
  } else {
    roundRect(ctx, coverX, coverY, coverSize, coverSize, coverR);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = Math.max(1, 1.5 * scale);
    const iconSize = coverSize * 0.22;
    const iconX = coverX + (coverSize - iconSize) / 2;
    const iconY = coverY + (coverSize - iconSize) / 2;
    roundRect(ctx, iconX, iconY, iconSize, iconSize, iconSize * 0.25);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(iconX + iconSize / 2, iconY + iconSize / 2, iconSize * 0.18, 0, Math.PI * 2);
    ctx.stroke();
  }

  const specH = cardH * 0.065;
  const specW = cardW * 0.84;
  const specX = cardX + (cardW - specW) / 2;
  const specY = coverY + coverSize + cardH * 0.06;

  if (state.spectrum){
    drawSpectrumFrame(ctx, specX, specY, specW, specH, scale, state.spectrum, state.__sampleRate || 44100);
  }

  const progY = specY + specH + cardH * 0.025;
  const progH = Math.max(2, 4 * scale);
  roundRect(ctx, specX, progY - progH / 2, specW, progH, progH / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fill();

  const p = state.duration > 0 ? Math.min(1, state.currentTime / state.duration) : 0;
  if (p > 0){
    roundRect(ctx, specX, progY - progH / 2, specW * p, progH, progH / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
  const knobR = Math.max(4, 7 * scale);
  ctx.beginPath();
  ctx.arc(specX + specW * p, progY, knobR, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = Math.max(1, 3 * scale);
  ctx.stroke();

  const timeFontSize = cardW * 0.038;
  const timeY = progY + cardH * 0.045;
  ctx.font = '500 ' + timeFontSize + 'px -apple-system, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(fmtTime(state.currentTime), specX, timeY);
  ctx.textAlign = 'right';
  ctx.fillText(fmtTime(state.duration), specX + specW, timeY);

  const ctrlY = timeY + cardH * 0.075;
  const playR = cardW * 0.082;
  const playCX = cardX + cardW / 2;
  const playCY = ctrlY;

  ctx.beginPath();
  ctx.arc(playCX, playCY, playR, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = Math.max(1, 1.5 * scale);
  ctx.stroke();

  if (state.isPlaying){
    const barW = playR * 0.18;
    const barH = playR * 0.75;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, playCX - barW * 1.4, playCY - barH / 2, barW, barH, barW * 0.3);
    ctx.fill();
    roundRect(ctx, playCX + barW * 0.4, playCY - barH / 2, barW, barH, barW * 0.3);
    ctx.fill();
  } else {
    const triSize = playR * 0.55;
    ctx.beginPath();
    ctx.moveTo(playCX - triSize * 0.4, playCY - triSize * 0.7);
    ctx.lineTo(playCX + triSize * 0.75, playCY);
    ctx.lineTo(playCX - triSize * 0.4, playCY + triSize * 0.7);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  const pillW = cardW * 0.28;
  const pillH = playR * 1.15;
  const pillY = playCY - pillH / 2;
  const leftPillX = cardX + cardW * 0.08;
  const rightPillX = cardX + cardW * 0.92 - pillW;
  const labels = ['-15s', '+15s'];
  [leftPillX, rightPillX].forEach(function(px, idx){
    roundRect(ctx, px, pillY, pillW, pillH, pillH / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = Math.max(1, 1.5 * scale);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = '500 ' + (timeFontSize * 0.9) + 'px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[idx], px + pillW / 2, pillY + pillH / 2);
  });
}

function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawSpectrumFrame(ctx, x, y, w, h, scale, magnitudes, sampleRate){
  const mm = (96 / 25.4) * scale;
  const barBase = Math.max(1, 1.0 * mm);
  const gapBase = barBase * 0.5;
  const period = barBase + gapBase;
  let N = Math.max(8, Math.floor((w + gapBase) / period));
  const realPeriod = w / N;
  const actualBarW = realPeriod * (barBase / period);
  const actualGap = realPeriod - actualBarW;

  const fMin = 20, fMax = 20000;
  const logMin = Math.log10(fMin), logMax = Math.log10(fMax);

  const half = magnitudes.length;
  const nyquist = sampleRate / 2;
  const binWidth = nyquist / half;

  const cornerR = actualBarW / 2;
  const minBarH = Math.max(actualBarW, 1);

  for (let i = 0; i < N; i++){
    const tL = i / N;
    const tR = (i + 1) / N;
    const fL = Math.pow(10, logMin + (logMax - logMin) * tL);
    const fR = Math.pow(10, logMin + (logMax - logMin) * tR);
    let binL = Math.floor(fL / binWidth);
    let binR = Math.ceil(fR / binWidth);
    binL = Math.max(0, Math.min(half - 1, binL));
    binR = Math.max(binL + 1, Math.min(half, binR));
    let v = 0;
    for (let b = binL; b < binR; b++) if (magnitudes[b] > v) v = magnitudes[b];

    const norm = v / 255;
    const barH = Math.max(minBarH, norm * (h - 2) * 0.98);
    const bx = x + i * realPeriod + actualGap / 2;
    const by = y + h - barH;
    roundRect(ctx, bx, by, actualBarW, barH, cornerR);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
}

function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function loadImage(src){
  return new Promise(function(resolve){
    if (!src){ resolve(null); return; }
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ resolve(null); };
    img.src = src;
  });
}

function dataURLtoArrayBuffer(dataUrl){
  const parts = dataUrl.split(',');
  const bin = atob(parts[1]);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

/* ---- 主渲染流程：完全离线，无实时录制 ---- */
async function renderVideo(fps, resKey, onProgress){
  if (!window.VideoEncoder || !window.AudioEncoder){
    throw new Error(t('errNoWebCodecs'));
  }
  if (!state.audio){
    throw new Error(t('errNoAudio'));
  }

  const resolutions = {
    '4k':    { w: 3840, h: 2160 },
    '2k':    { w: 2560, h: 1440 },
    '1080p': { w: 1920, h: 1080 },
    '720p':  { w: 1280, h: 720 },
    '480p':  { w: 854,  h: 480  }
  };
  const res = resolutions[resKey] || resolutions['1080p'];
  const W = res.w, H = res.h;

  const audioBuffer = await (function(){
    const tmpCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ab = dataURLtoArrayBuffer(state.audio);
    return tmpCtx.decodeAudioData(ab.slice(0)).then(function(buf){
      tmpCtx.close();
      return buf;
    }).catch(function(err){
      tmpCtx.close();
      throw err;
    });
  })();

  const sampleRate = audioBuffer.sampleRate;
  const totalDuration = audioBuffer.duration;
  const numChannels = Math.min(2, audioBuffer.numberOfChannels);

  const bgImg = await loadImage(state.bg);
  const coverImg = await loadImage(state.icon);

  const muxer = new WebMWriter({
    width: W, height: H, frameRate: fps,
    sampleRate: sampleRate, channels: numChannels,
    videoCodec: 'V_VP8', audioCodec: 'A_OPUS'
  });

  let videoEncoderError = null;
  const videoEncoder = new VideoEncoder({
    output: function(chunk){ muxer.addVideoChunk(chunk); },
    error: function(e){ console.error('VideoEncoder error:', e); videoEncoderError = e; }
  });
  const bitrate = Math.max(1_000_000, Math.round(W * H * fps * 0.07));
  videoEncoder.configure({
    codec: 'vp8',
    width: W, height: H,
    bitrate: Math.min(bitrate, 30_000_000),
    framerate: fps,
    latencyMode: 'quality'
  });

  let audioEncoderError = null;
  const audioEncoder = new AudioEncoder({
    output: function(chunk){ muxer.addAudioChunk(chunk); },
    error: function(e){ console.error('AudioEncoder error:', e); audioEncoderError = e; }
  });
  audioEncoder.configure({
    codec: 'opus',
    sampleRate: sampleRate,
    numberOfChannels: numChannels,
    bitrate: 128000
  });

  const chunkSamples = Math.round(sampleRate * 0.02);
  const totalSamples = audioBuffer.length;
  const channelsData = [];
  for (let c = 0; c < numChannels; c++) channelsData.push(audioBuffer.getChannelData(c));

  for (let offset = 0; offset < totalSamples; offset += chunkSamples){
    const len = Math.min(chunkSamples, totalSamples - offset);
    const planar = new Float32Array(len * numChannels);
    for (let c = 0; c < numChannels; c++){
      planar.set(channelsData[c].subarray(offset, offset + len), c * len);
    }
    const audioData = new AudioData({
      format: 'f32-planar',
      sampleRate: sampleRate,
      numberOfFrames: len,
      numberOfChannels: numChannels,
      timestamp: Math.round(offset / sampleRate * 1e6),
      data: planar
    });
    audioEncoder.encode(audioData);
    audioData.close();

    if ((offset / chunkSamples) % 20 === 0){
      await new Promise(function(r){ setTimeout(r, 0); });
      if (audioEncoderError) throw audioEncoderError;
    }
  }
  await audioEncoder.flush();

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  const totalFrames = Math.ceil(totalDuration * fps);
  const fftSize = 2048;
  const frameDurationMicro = Math.round(1e6 / fps);
  const keyframeInterval = fps * 2;

  for (let i = 0; i < totalFrames; i++){
    const time = i / fps;
    const sampleOffset = Math.round(time * sampleRate);
    const magnitudes = computeSpectrumMagnitudes(audioBuffer, sampleOffset, fftSize);

    drawCardFrame(ctx, W, H, bgImg, coverImg, {
      currentTime: time,
      duration: totalDuration,
      spectrum: magnitudes,
      isPlaying: true,
      __sampleRate: sampleRate
    });

    const frame = new VideoFrame(canvas, {
      timestamp: Math.round(time * 1e6),
      duration: frameDurationMicro
    });
    videoEncoder.encode(frame, { keyFrame: i % keyframeInterval === 0 });
    frame.close();

    if (i % 5 === 0){
      if (onProgress) onProgress(time, totalDuration);
      await new Promise(function(r){ setTimeout(r, 0); });
      if (videoEncoderError) throw videoEncoderError;
    }

    while (videoEncoder.encodeQueueSize > 20){
      await new Promise(function(r){ setTimeout(r, 5); });
      if (videoEncoderError) throw videoEncoderError;
    }
  }

  await videoEncoder.flush();

  return muxer.finalize();
}

/* ============ 保存视频弹窗 ============ */
(function initVideoModal(){
  const videoBtn = document.getElementById('videoBtn');
  const modal = document.getElementById('videoModal');
  const inner = document.getElementById('videoModalInner');
  const closeBtn = document.getElementById('videoModalClose');
  const fpsGroup = document.getElementById('fpsGroup');
  const resGroup = document.getElementById('resGroup');
  const exportBtn = document.getElementById('videoExportBtn');
  const exportLabel = document.getElementById('videoExportLabel');

  if (!videoBtn || !modal || !inner) return;

  bindSegmented(fpsGroup);
  bindSegmented(resGroup);

  let isOpen = false;
  let isExporting = false;
  let openTimers = [];

  function clearTimers(){ openTimers.forEach(function(t){ clearTimeout(t); }); openTimers = []; }
  function resetSliders(){
    [fpsGroup, resGroup].forEach(function(g){
      if (!g) return;
      const s = g.querySelector('.seg-slider');
      if (!s) return;
      s.style.transition = 'none';
      s.style.width = '0px';
      s.style.opacity = '0';
    });
  }
  function showSliders(){
    [fpsGroup, resGroup].forEach(function(g){
      if (!g) return;
      const s = g.querySelector('.seg-slider');
      if (!s) return;
      s.style.transition = '';
      s.style.opacity = '1';
    });
    syncSegmented(fpsGroup);
    syncSegmented(resGroup);
  }

  function openModal(){
    if (isOpen || isExporting) return;
    isOpen = true;
    clearTimers();
    const rect = videoBtn.getBoundingClientRect();
    const finalW = Math.min(340, window.innerWidth * 0.88);
    const finalH = 320;
    const finalX = (window.innerWidth - finalW) / 2;
    const finalY = (window.innerHeight - finalH) / 2;

    modal.style.transition = 'none';
    modal.style.display = 'block';
    modal.style.left = rect.left + 'px';
    modal.style.top = rect.top + 'px';
    modal.style.width = rect.width + 'px';
    modal.style.height = rect.height + 'px';
    modal.style.borderRadius = '999px';
    modal.style.opacity = '0';
    inner.classList.remove('visible');
    resetSliders();
    void modal.offsetWidth;

    modal.style.transition =
      'left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),' +
      'width .55s cubic-bezier(.4,0,.2,1),height .55s cubic-bezier(.4,0,.2,1),' +
      'opacity .3s ease,border-radius .5s ease';
    modal.style.left = finalX + 'px';
    modal.style.top = finalY + 'px';
    modal.style.width = finalW + 'px';
    modal.style.height = finalH + 'px';
    modal.style.borderRadius = '24px';
    modal.style.opacity = '1';
    openTimers.push(setTimeout(function(){ inner.classList.add('visible'); }, 380));
    openTimers.push(setTimeout(showSliders, 620));
  }

  function closeModal(){
    if (!isOpen || isExporting) return;
    isOpen = false;
    clearTimers();
    const rect = videoBtn.getBoundingClientRect();
    inner.classList.remove('visible');
    modal.style.transition =
      'left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),' +
      'width .5s cubic-bezier(.4,0,.2,1),height .5s cubic-bezier(.4,0,.2,1),' +
      'opacity .35s ease .15s,border-radius .5s ease';
    modal.style.left = rect.left + 'px';
    modal.style.top = rect.top + 'px';
    modal.style.width = rect.width + 'px';
    modal.style.height = rect.height + 'px';
    modal.style.borderRadius = '999px';
    modal.style.opacity = '0';
    openTimers.push(setTimeout(function(){ if (!isOpen) modal.style.display = 'none'; }, 700));
  }

  videoBtn.addEventListener('click', function(e){ e.stopPropagation(); openModal(); });
  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closeModal(); });
  document.addEventListener('click', function(e){
    if (!isOpen || isExporting) return;
    if (e.target.closest('#videoModal') || e.target.closest('#videoBtn')) return;
    closeModal();
  });
  window.addEventListener('resize', function(){
    if (!isOpen) return;
    const finalW = Math.min(340, window.innerWidth * 0.88);
    const finalH = 320;
    modal.style.transition = 'none';
    modal.style.left = ((window.innerWidth - finalW) / 2) + 'px';
    modal.style.top = ((window.innerHeight - finalH) / 2) + 'px';
    modal.style.width = finalW + 'px';
    modal.style.height = finalH + 'px';
    setTimeout(showSliders, 60);
  });

  if (exportBtn){
    exportBtn.addEventListener('click', async function(e){
      e.stopPropagation();
      if (isExporting) return;

      if (!state.audio){
        alert(t('errNoAudio'));
        return;
      }

      const fps = parseInt(fpsGroup.querySelector('.seg-opt.active').dataset.val, 10) || 30;
      const resKey = resGroup.querySelector('.seg-opt.active').dataset.val || '1080p';

      isExporting = true;
      exportBtn.disabled = true;
      exportLabel.textContent = t('rendering') + ' 0%';

      try {
        const blob = await renderVideo(fps, resKey, function(cur, dur){
          const pct = Math.round(cur / dur * 100);
          exportLabel.textContent = t('rendering') + ' ' + pct + '%';
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '卡片视频_' + resKey + '_' + fps + 'fps.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);

        exportLabel.textContent = t('renderDone');
        setTimeout(function(){
          exportLabel.textContent = t('exportVideo');
          exportBtn.disabled = false;

if (typeof window.__AUDIO_DATA_URL__ === 'string' && window.__AUDIO_DATA_URL__){

    var _bin = atob(_parts[1]);

    for (var _i = 0; _i < _bin.length; _i++) _bytes[_i] = _bin.charCodeAt(_i);
    var _blob = new Blob([_bytes], { type: _mime });

function fmt(sec){
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

playBtn.addEventListener('click', function(){

let isSeeking = false;
function render(){
  const d = audio.duration || 0;
  const c = audio.currentTime || 0;
  const p = d > 0 ? (c / d) * 100 : 0;
  fillEl.style.width = p + '%';
  knobEl.style.left = p + '%';
  curEl.textContent = fmt(c);
  durEl.textContent = fmt(d);
  progress.setAttribute('aria-valuenow', Math.round(p));
}
function seekFromEvent(e){
  const rect = progress.getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
  const ratio = rect.width ? x / rect.width : 0;
  if (audio.duration) audio.currentTime = ratio * audio.duration;
  fillEl.style.width = (ratio * 100) + '%';
  knobEl.style.left = (ratio * 100) + '%';
  curEl.textContent = fmt(ratio * (audio.duration || 0));
}
progress.addEventListener('pointerdown', function(e){
  if (!audio.duration) return;
  isSeeking = true;
  progress.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});
progress.addEventListener('pointermove', function(e){ if (isSeeking) seekFromEvent(e); });
function endSeek(e){
  if (!isSeeking) return;
  isSeeking = false;
  try { progress.releasePointerCapture(e.pointerId); } catch(_){}
}
progress.addEventListener('pointerup', endSeek);
progress.addEventListener('pointercancel', endSeek);
progress.addEventListener('keydown', function(e){
  if (!audio.duration) return;
  if (e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); render(); }
  if (e.key === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); render(); }
  e.preventDefault();
});

function loop(){
  if (!isSeeking && !audio.paused) render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
audio.addEventListener('loadedmetadata', render);
audio.addEventListener('durationchange', render);
audio.addEventListener('timeupdate', function(){ if (!isSeeking) render(); });

document.addEventListener('keydown', function(e){

});

/* ============ 频谱 ============ */
const spectrumCanvases = [
  document.getElementById('spectrumCard'),
  document.getElementById('spectrumBottom')
].filter(Boolean);

let audioCtx = null;
let analyser = null;
let sourceNode = null;
let freqData = null;

function initAudioCtx(){
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  if (!audio) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.78;
    analyser.minDecibels = -95;
    analyser.maxDecibels = -12;
    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (err){
    console.warn(err);
    audioCtx = null;
  }
}

function syncSpectrumSizes(){
  const dpr = window.devicePixelRatio || 1;
  spectrumCanvases.forEach(function(c){
    const rect = c.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  });
}
if (spectrumCanvases.length){
  if ('ResizeObserver' in window){
    const roS = new ResizeObserver(syncSpectrumSizes);
    spectrumCanvases.forEach(function(c){ roS.observe(c); });
  }
  window.addEventListener('resize', syncSpectrumSizes);
  syncSpectrumSizes();
}

function pxPerMm(){
  const dpr = window.devicePixelRatio || 1;
  return (96 / 25.4) * dpr;
}

function roundRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawSpectrum(){
  if (!spectrumCanvases.length){ requestAnimationFrame(drawSpectrum); return; }
  let data = null;
  if (analyser && freqData){
    analyser.getByteFrequencyData(freqData);
    data = freqData;
  }
  spectrumCanvases.forEach(function(canvas){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    if (!ctx || W < 2 || H < 2) return;
    ctx.clearRect(0, 0, W, H);
    drawBars(ctx, W, H, data);
  });
  requestAnimationFrame(drawSpectrum);
}

function drawBars(ctx, W, H, data){
  const mm = pxPerMm();
  const barW = 1.0 * mm, gapW = 0.5 * mm;
  const period = barW + gapW;
  let N = Math.max(8, Math.floor((W + gapW) / period));
  const realPeriod = W / N;
  const actualGap = realPeriod * (gapW / period);
  const actualBarW = realPeriod - actualGap;
  const fMin = 20, fMax = 20000;
  const logMin = Math.log10(fMin), logMax = Math.log10(fMax);
  const sampleRate = audioCtx ? audioCtx.sampleRate : 44100;
  const nyquist = sampleRate / 2;
  const binCount = analyser ? analyser.frequencyBinCount : 2048;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  const dpr = window.devicePixelRatio || 1;
  ctx.lineWidth = Math.max(0.5, 0.6 * dpr);
  const minBarH = actualBarW, cornerR = actualBarW / 2;
  for (let i = 0; i < N; i++){
    const tL = i / N, tR = (i + 1) / N;
    const fL = Math.pow(10, logMin + (logMax - logMin) * tL);
    const fR = Math.pow(10, logMin + (logMax - logMin) * tR);
    let v = 0;
    if (data){
      let binL = Math.max(0, Math.min(binCount - 1, Math.floor(fL / nyquist * binCount)));
      let binR = Math.max(binL + 1, Math.min(binCount, Math.ceil(fR / nyquist * binCount)));
      for (let b = binL; b < binR; b++) if (data[b] > v) v = data[b];
    }
    const norm = v / 255;
    const h = Math.max(minBarH, norm * (H - 2) * 0.98);
    const x = i * realPeriod + actualGap / 2;
    const y = H - h;
    roundRectPath(ctx, x, y, actualBarW, h, cornerR);
    ctx.fill();
    ctx.stroke();
  }
}
requestAnimationFrame(drawSpectrum);
</script>

<script>
/* ============ 上传与保存逻辑（不进入保存的 HTML） ============ */
const bgEl = document.getElementById('bg');

function readAsDataURL(file){
  return new Promise(function(resolve, reject){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function blobToDataURL(blob){
  return new Promise(function(resolve){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ resolve(null); };
    r.readAsDataURL(blob);
  });
}
function validateImage(dataUrl){
  return new Promise(function(resolve){
    if (!dataUrl || typeof dataUrl !== 'string'){ resolve(false); return; }
    const img = new Image();
    img.onload = function(){ resolve(img.naturalWidth >= 8 && img.naturalHeight >= 8); };
    img.onerror = function(){ resolve(false); };
    img.src = dataUrl;
  });
}
function readMimeString(view, start, end){
  let s = '';
  for (let i = start; i < end; i++){
    const c = view[i];
    if (c === 0) break;
    s += String.fromCharCode(c);
  }
  return s;
}

async function extractCoverFromAudio(file){
  try {
    const buf = await file.arrayBuffer();
    const view = new Uint8Array(buf);
    if (view.length < 10) return null;
    if (view[0] !== 0x49 || view[1] !== 0x44 || view[2] !== 0x33) return null;
    const version = view[3];
    if (version < 2 || version > 4) return null;
    const flags = view[5];
    const tagSize =
      ((view[6] & 0x7f) << 21) | ((view[7] & 0x7f) << 14) |
      ((view[8] & 0x7f) << 7)  |  (view[9] & 0x7f);
    const tagEnd = Math.min(10 + tagSize, view.length);
    let offset = 10;
    if ((version === 3 || version === 4) && (flags & 0x40)){
      if (offset + 4 > tagEnd) return null;
      if (version === 4){
        const extSize =
          ((view[offset] & 0x7f) << 21) | ((view[offset+1] & 0x7f) << 14) |
          ((view[offset+2] & 0x7f) << 7) |  (view[offset+3] & 0x7f);
        offset += Math.max(4, extSize);
      } else {
        const extSize =
          ((view[offset] & 0xff) << 24) | ((view[offset+1] & 0xff) << 16) |
          ((view[offset+2] & 0xff) << 8) | (view[offset+3] & 0xff);
        offset += 4 + (extSize >>> 0);
      }
    }
    if (offset >= tagEnd) return null;
    if (version === 2){
      while (offset + 6 <= tagEnd){
        const id = String.fromCharCode(view[offset], view[offset+1], view[offset+2]);
        if (id === '\0\0\0') break;
        const frameSize = (view[offset+3] << 16) | (view[offset+4] << 8) | view[offset+5];
        if (frameSize <= 0 || offset + 6 + frameSize > view.length) break;
        if (id === 'PIC'){
          const cover = await parseAPIC(view, offset + 6, frameSize);
          if (cover) return cover;
        }
        offset += 6 + frameSize;
      }
    } else {
      while (offset + 10 <= tagEnd){
        const id = String.fromCharCode(view[offset]) + String.fromCharCode(view[offset+1]) +
                   String.fromCharCode(view[offset+2]) + String.fromCharCode(view[offset+3]);
        if (id === '\0\0\0\0') break;
        let frameSize;
        if (version === 4){
          frameSize =
            ((view[offset+4] & 0x7f) << 21) | ((view[offset+5] & 0x7f) << 14) |
            ((view[offset+6] & 0x7f) << 7) | (view[offset+7] & 0x7f);
        } else {
          frameSize =
            ((view[offset+4] & 0xff) << 24) | ((view[offset+5] & 0xff) << 16) |
            ((view[offset+6] & 0xff) << 8) | (view[offset+7] & 0xff);
          frameSize = frameSize >>> 0;
        }
        if (frameSize <= 0 || offset + 10 + frameSize > view.length) break;
        if (id === 'APIC'){
          const cover = await parseAPIC(view, offset + 10, frameSize);
          if (cover) return cover;
        }
        offset += 10 + frameSize;
      }
    }
    return null;
  } catch (e){ return null; }
}

async function parseAPIC(view, start, size){
  try {
    const end = Math.min(start + size, view.length);
    if (start + 4 >= end) return null;
    const encoding = view[start];
    let offset = start + 1;
    let mimeEnd = offset;
    while (mimeEnd < end && view[mimeEnd] !== 0) mimeEnd++;
    let mime = '';
    if (mimeEnd > offset) mime = readMimeString(view, offset, mimeEnd).trim();
    if (!mime || mime.indexOf('/') === -1) mime = 'image/jpeg';
    offset = mimeEnd + 1;
    offset += 1;
    if (encoding === 1 || encoding === 2){
      while (offset < end - 1){
        if (view[offset] === 0 && view[offset+1] === 0){ offset += 2; break; }
        offset += 2;
      }
    } else {
      while (offset < end && view[offset] !== 0) offset++;
      offset += 1;
    }
    if (offset >= end) return null;
    const imageData = view.subarray(offset, end);
    if (imageData.length < 200) return null;
    const blob = new Blob([imageData], { type: mime });
    const dataUrl = await blobToDataURL(blob);
    if (!dataUrl) return null;
    const ok = await validateImage(dataUrl);
    if (!ok) return null;
    return dataUrl;
  } catch (e){ return null; }
}
